# wayfire.ini - the compositor, configured to draw the mockup's desktop.
#
# Installed at /root/.config/wayfire.ini, which is where wayfire looks
# by itself. start-desktop names it with -c anyway, so that the file
# being read is the file somebody edited and not whichever copy came
# first on some search order.
#
# ── two facts decide most of what is below ──
#
# Nothing draws a title bar but the application. Every window in this
# desktop draws its own header bar - that is what the mockup is, windows
# with their own headers overlapping - so a compositor title bar above
# one would put a second bar, in a different grey, on every window on
# the screen. The decoration plugin is therefore not in the plugin list,
# and clients are told to decorate themselves.
#
# Nothing here is accelerated. QEMU has no GPU, so Mesa falls back to
# llvmpipe and every pixel of every frame is drawn by the CPU. The
# effects that are free on a graphics card - blur, wobbly windows, the
# cube - are not in the plugin list, and on this machine they are not
# coming back later.
#
# Every option name and every default quoted in the comments below was
# read out of /usr/share/wayfire/metadata/*.xml on this machine, which
# is wayfire's own description of what it accepts. Where a line here
# only restates a default, it is because the settings screen promises
# that shortcut and it should be findable in this file.


[core]

# Floating, not tiled.
#
# simple-tile is absent on purpose: the mockup is overlapping windows
# with shadows under them, and a tiler has nowhere to put a shadow.
#
# So is decoration, which is the plugin that would draw the second title
# bar. It IS in wayfire's default list, so leaving this line out would
# quietly turn it on.
#
# So is every effect. On llvmpipe a blur is a full-screen read, a blur
# and a write, per frame, on the CPU that is already compositing.
plugins = \
  autostart \
  command \
  animate \
  expo \
  grid \
  idle \
  move \
  place \
  resize \
  switcher \
  vswitch \
  wm-actions

# The desktop behind everything.
#
# #0e0e0e is the design system's darkest surface, the one it calls the
# canvas - what every other surface sits on. It has to be darker than an
# unfocused window's #202020, because the whole point of the unfocused
# state is that a window settles TOWARD the desktop. A desktop lighter
# than the window would make losing focus look like rising, and the rule
# the mockup encodes would read backwards.
#
# Flat, and not an image, because there is no image. A wallpaper is also
# a full-screen texture recomposited over every damage rectangle, which
# on llvmpipe is paid for in every frame.
#
# Wayfire's own default is written as four floats (0.1 0.1 0.1 1.0). If
# a build turns out not to take the hex form, this colour is
# 0.055 0.055 0.055 1.0.
background_color = #0E0E0EFF

# Client-side decorations, everywhere, always. This is already wayfire's
# default and it is written out because it is half of the reason the
# decoration plugin is missing above - the other half being that a
# client which asks for server-side gets told no.
preferred_decoration_mode = client

# Nine workspaces in a 3x3 grid. The settings screen says nine.
vwidth = 3
vheight = 3

# 창 닫기.
#
# core's own binding rather than a command, so the window is asked to
# close through the protocol and gets to put up "save first?". Killing
# the process does not.
#
# Wayfire's default is "<super> KEY_Q | <alt> KEY_F4" and the second
# half is dropped here. An unlisted shortcut is worse than a missing
# one: 설정 › 키 지정 shows Alt+F4 as free, somebody assigns it, and the
# conflict the screen exists to catch is one it cannot see.
close_top_view = <super> KEY_Q

# No X11.
#
# Wayfire's default is true. Nothing in this desktop is an X11
# application, and XWayland is a second display server to start, keep
# alive and render through, on a CPU already drawing every pixel. There
# is also no Xwayland binary installed, so leaving the default would
# mean a failure at every startup about something nobody asked for.
xwayland = false


[input]

# 한/영 is not here and cannot be.
#
# Switching input sources is an input method's job. The compositor sees
# a keycode, and what turns a sequence of them into 한글 is a program
# this session does not start yet - so 설정 › 키보드 › 입력 소스 is not
# wired to anything below, and the spec's note that the compositor
# answers 한/영 before any window is true of the desktop it describes
# and not of this one.
xkb_layout = us

# Named rather than left at wayfire's "default".
#
# Adwaita is the one cursor theme installed. A theme name that does not
# resolve leaves no pointer drawn at all, and a desktop with no pointer
# on it is one somebody reports as frozen.
cursor_theme = Adwaita


[autostart]

# wf-shell is wayfire's own panel and background, and it must stay off.
#
# It is a perfectly good panel and it is not this one. It would draw a
# second bar at the top of the screen in its own colours, beside nothing
# else in the design system. The top bar in the spec is ours to write.
autostart_wf_shell = false

# One terminal on first light, and this line is temporary.
#
# Until the top bar exists there is no panel, no launcher and no clock,
# so a working desktop is a flat #0e0e0e rectangle - which is pixel for
# pixel what a compositor that started and then died looks like. This
# terminal is the difference between those two, and it is also somewhere
# to type for anyone who does not know that Super+T exists.
#
# Delete it the day the bar draws.
terminal = foot


[command]

# The shortcuts 설정 › 키 지정 already claims.
#
# Wayfire spells keys the way the kernel does, with the names from
# linux/input-event-codes.h. Commands go through /bin/sh, so ~ and
# $(...) below are the shell's and mean what they look like.
#
# What is NOT here is listed in README.md instead of being bound to a
# program that is not installed. A shortcut wired to a missing binary
# does nothing and says nothing, which is worse than one that was never
# claimed - and start-desktop names the missing ones at startup, once,
# where somebody can read them.

# 터미널 열기
binding_terminal = <super> KEY_T
command_terminal = foot

# 파일 관리자 열기
binding_files = <super> KEY_E
command_files = lp-files

# 화면 잠금.
#
# swaylock until the design's own lock screen exists. Read README.md
# before trusting this key: if swaylock is not installed, Super+L locks
# nothing, and a screen that was not locked looks exactly like one that
# was until somebody touches it.
binding_lock = <super> KEY_L
command_lock = swaylock -c 0e0e0e

# 전체 스크린샷 and 영역 스크린샷.
#
# Two names for the key, and the reason is worth writing down. A PC
# keyboard's Print Screen reports keycode 99, which is KEY_SYSRQ -
# KEY_PRINT is 210, a different key on media keyboards. Wayfire's own
# example config binds KEY_PRINT. Rather than decide which of us is
# wrong about somebody else's keyboard, both are accepted.
#
# ~/사진 is the folder the file manager puts in its sidebar, so a
# screenshot lands where a person would go looking for it. start-desktop
# creates it, because grim writing to a directory that is not there
# fails and says so to a log nobody is reading.
binding_screenshot = KEY_SYSRQ | KEY_PRINT
command_screenshot = grim ~/사진/$(date +%Y-%m-%d_%H%M%S).png

binding_screenshot_area = <shift> KEY_SYSRQ | <shift> KEY_PRINT
command_screenshot_area = grim -g "$(slurp)" ~/사진/$(date +%Y-%m-%d_%H%M%S).png

# 셸 강제 재시작.
#
# Ending the compositor is how it gets restarted: start-desktop returns,
# init starts it again a second later. That is not a workaround, it is
# what "restart the shell" means on a machine whose init supervises the
# session.
#
# SIGTERM and not SIGKILL. On the way out wayfire hands the virtual
# terminal back to the kernel and puts the keyboard into text mode
# again. A compositor that is killed outright does neither, and what is
# left is a dark screen that does not answer the keyboard. README.md has
# the rest of that.
binding_restart = <ctrl> <alt> KEY_BACKSPACE
command_restart = pkill -TERM wayfire


[animate]

# The design system asks for springs and wayfire does not have one.
#
# Its animations are a duration and a fixed curve, so the model does not
# map: no stiffness, no damping, and no way to bend an animation that is
# already running toward a new target. A window closed while it is still
# opening is cut off rather than turned around, which is the exact case
# §1-5 chose springs for.
#
# What does carry over is the timing budget - most things 150-250ms, the
# big movements 350. Wayfire's defaults are 400, 500 and 600, so every
# number below is a reduction and none of them is rounded.
open_animation = zoom
close_animation = zoom
duration = 200
zoom_duration = 200
fade_duration = 200

# The first window of a session is the big one.
startup_duration = 350


[expo]

# 작업공간 개요.
#
# Wayfire's default opens this on Super tapped by itself. That is a
# Windows habit and it also makes Super unusable as a modifier that can
# be held and thought about, so the overview gets a key of its own.
toggle = <super> KEY_TAB
duration = 350

# 작업공간 전환, and this is the one shortcut in the settings screen
# that this wayfire cannot give as promised.
#
# The screen says Super+1 to Super+9 switches workspace. In this build
# there is no binding for that: vswitch, which owns workspace movement,
# has binding_left, binding_right, binding_up and binding_down and no
# numbered ones, and there is no IPC to ask from outside either.
#
# What exists is these - the same keys, selecting a workspace while the
# overview is open. So Super+Tab then Super+1 goes where Super+1 was
# supposed to go on its own, and the muscle memory is half right rather
# than wrong. README.md says what it would take to make it whole.
select_workspace_1 = <super> KEY_1
select_workspace_2 = <super> KEY_2
select_workspace_3 = <super> KEY_3
select_workspace_4 = <super> KEY_4
select_workspace_5 = <super> KEY_5
select_workspace_6 = <super> KEY_6
select_workspace_7 = <super> KEY_7
select_workspace_8 = <super> KEY_8
select_workspace_9 = <super> KEY_9


[switcher]

# 창 전환. Wayfire's defaults, written out because a shortcut the
# settings screen promises should be findable in this file.
next_view = <alt> KEY_TAB
prev_view = <alt> <shift> KEY_TAB


[grid]

# 왼쪽 반쪽 and 오른쪽 반쪽.
#
# A grid slot sets the window's tiled state, which is what half-screen
# means to the application: GTK squares off the corners on the tiled
# edge instead of drawing a floating window that happens to be half as
# wide, with a rounded corner and a shadow against the screen edge.
slot_l = <super> KEY_LEFT
slot_r = <super> KEY_RIGHT
duration = 200

# The centre slot has to be cleared, and this is not tidying.
#
# Wayfire's default for slot_c is "<super> KEY_UP | <super> KEY_KP5",
# and the settings screen has promised Super+Up to 최대화, which
# wm-actions answers below. Two plugins bound to one key is a coin toss
# decided by load order.
slot_c = none


[wm-actions]

# 최대화, and it has to be this rather than the grid's centre slot.
#
# The theme draws a maximised window differently - no rounded corners,
# no shadow, because there is nothing beside it for a shadow to fall on.
# GTK only knows to do that when the window is in the xdg-shell
# maximised state, and this is the binding that asks for that state by
# name. A slot that merely resizes a window to the whole output would
# leave GTK drawing a floating window with round corners on all four
# screen edges.
#
# Every wm-actions binding ships disabled, so this section adds a key
# rather than moving one.
toggle_maximize = <super> KEY_UP


[vswitch]

# Moving between workspaces without the overview.
#
# These are wayfire's own defaults and they are written out because they
# are real, useful, and not in the settings screen - which is a gap in
# the screen rather than in this file. See the note in [expo] for why
# Super+1-9 cannot be these.
#
# Super with a plain arrow is not available: 설정 › 키 지정 gave all four
# to the window, and grid and wm-actions above have taken them.
binding_left  = <super> <alt> KEY_LEFT
binding_right = <super> <alt> KEY_RIGHT
binding_up    = <super> <alt> KEY_UP
binding_down  = <super> <alt> KEY_DOWN

# A workspace change moves the whole screen, so it gets the 350 that
# §1-5 allows the big movements. Wayfire's default is 300, which is
# inside the budget already - it is raised, not lowered, because this is
# the largest single movement the desktop makes and the spec names it.
duration = 350


[place]

# Where a window with no opinion goes. Centre, which is wayfire's
# default and also the mockup: one window at a time on an empty desktop.
# A cascade only starts earning its keep once there are enough windows
# to lose one behind another.
mode = center


[idle]

# Both off, and both are decisions.
#
# The screensaver, because there is no lock screen yet. A blank screen
# over an unlocked machine is the appearance of security with none of
# it, and it would be the second thing on this desktop that looks
# locked and is not. Wayfire's default is 3600 seconds.
#
# DPMS is already off by default, and it is written out so that nobody
# turns it on without reading this. Switching a virtual display off and
# back on is the one operation on this stack that can return a dark
# screen with everything still running - which is precisely the failure
# the whole session is arranged to avoid. Saved power on a machine that
# is plugged in is not worth a machine that looks dead and is not.
screensaver_timeout = -1
dpms_timeout = -1
