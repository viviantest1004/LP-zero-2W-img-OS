# settings.ini - the settings that decide what gtk.css is drawing on top
# of, and the things about a window that CSS cannot say at all.
#
# The same file is installed twice, at ~/.config/gtk-3.0/settings.ini and
# ~/.config/gtk-4.0/settings.ini (and as the system default in
# /etc/xdg/gtk-3.0 and gtk-4.0, which is what an account made after the
# image was built picks up). Both GTK versions read every key here, and
# splitting it into two files that have to be kept in step is how the two
# versions of a desktop start looking different from each other.

[Settings]

# The base both gtk.css files sit on top of. They state the mockup and nothing
# else, so something has to draw the rest of GTK, and Adwaita is what Debian
# already has. Naming a theme of our own here would mean restyling every widget
# GTK has, with each one forgotten falling back to GTK's unstyled default.
gtk-theme-name=Adwaita

# Picks Adwaita's dark variant. It is a base, not the look: the mockup's own
# greys are in gtk.css and override it. libadwaita applications do not read
# this key - they ask the desktop portal, which reads the gsettings
# color-scheme key that 어두운 스타일 in quick settings writes.
gtk-application-prefer-dark-theme=1

# The mockup's dock is colourful app icons. Adwaita's application icons are
# a handful of grey outlines; Papirus, which the base already carries, has a
# coloured icon for every application in the dock and for the symbolic
# status icons the bar uses. Papirus-Dark is the variant whose symbolic
# icons are drawn light, for a dark desktop.
gtk-icon-theme-name=Papirus-Dark

# The design system's face (design/feel.md §1-3). 10.5pt is the 14px body
# size at GTK's 96dpi; the output scale is the compositor's business and
# multiplies everything together, so this stays 10.5 on the 4K panel too.
gtk-font-name=Pretendard Variable 10.5

# Minimise, maximise, close - the mockup's terminal window has all three,
# and a window drawn by its application should not have fewer buttons than
# one drawn by the compositor sitting next to it. Minimising is safe now:
# the dock brings a minimised window back with one tap, which it could not
# do while there was no dock.
gtk-decoration-layout=:minimize,maximize,close

# The cursor theme and size, for the touchpad. 24 logical pixels is 48
# physical on the 4K panel at scale 2, which is the size the pointer is
# drawn at anyway.
gtk-cursor-theme-name=Adwaita
gtk-cursor-theme-size=24
