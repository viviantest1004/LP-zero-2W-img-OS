# wpa_supplicant.conf - 무선 접속 설정.
#
# ★ ssid 와 psk 를 자기 공유기 것으로 바꿔야 한다. ★
#
# 이 파일은 SD 카드의 데이터 파티션(/data)에도 같은 이름으로 두면
# 그쪽이 우선 사용된다. SD 를 다시 굽지 않고 비밀번호를 바꿀 수 있다.
#
# 지원: WPA2-PSK. WPA3(SAE)는 빌드에서 제외했다 - 내부 암호 구현에
# 필요한 타원곡선 연산이 없기 때문이다. 공유기가 WPA3 전용이면
# WPA2 혼용 모드로 바꿔야 한다.

ctrl_interface=/var/run/wpa_supplicant
update_config=1

network={
    ssid="여기에_공유기_이름"
    psk="여기에_비밀번호"
    key_mgmt=WPA-PSK
}
