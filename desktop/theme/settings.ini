# settings.ini - the four settings that decide what gtk.css is drawing on top
# of, and the one thing about the window that CSS cannot say at all.
#
# The same file is installed twice, at ~/.config/gtk-3.0/settings.ini and
# ~/.config/gtk-4.0/settings.ini. Both GTK versions read all four keys, and
# splitting it into two files that have to be kept in step is how the two
# versions of a desktop start looking different from each other.

[Settings]

# The base both gtk.css files sit on top of. They state the mockup and nothing
# else, so something has to draw the rest of GTK, and Adwaita is what Debian
# already has. Naming a theme of our own here would mean restyling every widget
# GTK has, with each one forgotten falling back to GTK's unstyled default.
gtk-theme-name=Adwaita

# Picks Adwaita's dark variant. It is a base, not the look: the mockup's own
# greys are in gtk.css and override it. Note that libadwaita applications do
# not read this key at all - they ask the desktop portal for the colour scheme -
# so on a session without a portal answering, a libadwaita app comes up light.
gtk-application-prefer-dark-theme=1

# The mockup's interface is 11-12px, which is smaller than GTK's default. GTK
# font sizes are points and CSS sizes are pixels, and at 96dpi 9pt is exactly
# the 12px the mockup gives the window title. The two only agree at 96dpi,
# which is why gtk-xft-dpi is left alone here rather than raised: moving it
# moves the font and leaves every px in gtk.css where it was.
#
# The font is set here rather than in gtk.css because this key sets the default
# every widget and every Pango context starts from, where a CSS rule broad
# enough to do the same job would also overrule every deliberate font an
# application picked. If Nanum Gothic is not installed, fontconfig substitutes
# silently and the interface comes up in whatever it chose - the font is a
# dependency of this file, not a suggestion.
gtk-font-name=Nanum Gothic 9

# One button, and it is close. Nothing before the colon means nothing on the
# left; one name after it means one button on the right. This has to live here
# because GTK CSS has no way to hide a widget - a theme can size and colour a
# minimise button but it cannot take it away, so the decoration layout is the
# only place the answer fits. An application that calls
# gtk_header_bar_set_decoration_layout() overrides this for its own window.
gtk-decoration-layout=:close
