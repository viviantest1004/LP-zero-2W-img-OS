# nouveau loads through /usr/lib/lp/nouveau-gate, which decides per
# machine: an NVIDIA GPU that draws the screen gets nouveau, the second
# GPU of an Optimus laptop (the XPS 15 9550's GTX 960M) does not, and is
# switched off without it. The gate says why.
install nouveau /usr/lib/lp/nouveau-gate $CMDLINE_OPTS
