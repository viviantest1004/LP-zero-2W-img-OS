# wayfire.ini - the compositor on a machine with a graphics card.
#
# Installed at ~/.config/wayfire.ini. session-run starts wayfire with this
# file when the machine has a real GPU (the XPS 15's Intel HD 530), and
# sway with sway.config when it does not (a VM with no 3D); session-run
# says why there are two. Everything the person sees that is not a window
# - the bar, the dock, the wallpaper, quick settings, the app grid - is a
# layer-shell program of ours started by lp-shell-start, identically under
# both. What is left to the compositor is windows: their decorations,
# their animations, workspaces, the overview, and touch gestures.
#
# Every option name and default quoted below was read from wayfire 0.7.4's
# own metadata (/usr/share/wayfire/metadata/*.xml) and source; where a
# line restates a default it is because something else in the system
# (Settings, a comment in another file) promises that value.
#
# ── motion ──
#
# The design's springs (COMMON.md, Motion; desktop/common/lp-motion.h) are
# 340 ms for windows and workspaces. Wayfire 0.7 animates with fixed-
# duration curves, not springs, and has ONE duration per effect for both
# opening and closing: the design's 340 in / 238 out cannot both be
# honoured, so windows use 300 ms, between the two. Workspace switch and
# the overview are 340 ms, exactly.
#
# Window open/close is a fade, not wayfire's "zoom". The design says an
# appearing window starts at scale 0.96; wayfire 0.7's zoom animation
# starts at 1/3, hard-coded (plugins/animate/basic_animations.hpp,
# `timed_transition_t(progression, 1. / 3, 1)`), and a window growing from
# a third of its size is much further from the design than one that only
# fades. Getting the 0.96 zoom needs that one constant changed in a rebuilt
# wayfire package; it is not a setting.
#
# No wobbly windows, no blur, no cube: at 3840x2160 on an HD 530 every one
# of them is full-screen texture work per frame, and none is in the design.
#
# Reduced motion (Settings -> Accessibility) sets every duration below to
# 0; that is Settings' job, done by editing this file.

[core]

# decoration draws the title bar with minimise, maximise and close for
# windows that do not draw their own - foot, like the mockup's terminal.
# GTK 4 and Firefox draw their own header bars and ask for no decoration,
# and wayfire respects that; nothing gets two title bars.
# vswipe is the touchpad's three-finger workspace swipe, which follows
# the fingers; the touchscreen's is core gestures bound in [vswitch].
plugins = \
  alpha \
  animate \
  autostart \
  command \
  decoration \
  expo \
  grid \
  idle \
  move \
  place \
  resize \
  scale \
  switcher \
  vswipe \
  vswitch \
  wm-actions

# Under the wallpaper, for the instant before lp-desktop draws it: the
# wallpaper's own darkest colour, so the start is not a flash of grey.
background_color = #1A0818FF

# Server-side decorations for whoever asks: that is what gives foot the
# mockup's title bar with minimise/maximise/close.
preferred_decoration_mode = server

# Nine workspaces, 3x3. Three-finger swipes move between them.
vwidth = 3
vheight = 3

close_top_view = <super> KEY_Q | <alt> KEY_F4

# X11 programs still exist (and some fonts-and-graphics track tests use
# them). wlroots starts Xwayland lazily, on the first X client, so an
# all-Wayland session pays nothing for this.
xwayland = true

# Wait for a frame at most this long (ms) before compositing anyway - the
# difference between a 60 Hz panel that sometimes shows a frame late and
# one that drops it.
max_render_time = -1


[output:eDP-1]

# The XPS 15 9550's panel: 3840x2160, 15.6" - 282 pixels per inch. At
# scale 2 a logical pixel is 0.18 mm and the shell's 48 px touch targets
# are 8.6 mm, a fingertip.
mode = 3840x2160@60000
scale = 2.000000


[input]

xkb_layout = us
xkb_options = grp:alt_shift_toggle

# The precision touchpad: tap to click, the way the owner's other
# machines behave, and two-finger scrolling in the direction the content
# moves. disable while typing, because a palm on this touchpad while
# typing moves the caret.
tap_to_click = true
natural_scroll = true
disable_touchpad_while_typing = true

# Touchscreen gesture recognition. 1.0 is wayfire's calibration; the
# real panel may need this tuned (it cannot be felt in a VM).
gesture_sensitivity = 1.000000

kb_repeat_delay = 400
kb_repeat_rate = 40

# The cursor's theme and size belong to the fonts-and-graphics track
# (desktop/theme/settings.ini says the same for GTK); 24 at scale 2.
cursor_size = 24


[decoration]

# The mockup's terminal: a dark title bar, the title, and three buttons.
# 34 is the height of the GTK header bars next to it, so a foot window and
# a Files window line up. The colours are the design system's window
# greys: #1e1e1e focused, #151515 not (an unfocused window settles
# towards the desktop).
title_height = 34
border_size = 4
font = Pretendard Variable
active_color = #1E1E1EFF
inactive_color = #151515FF
button_order = minimize maximize close


[animate]

open_animation = fade
close_animation = fade
duration = 300
enabled_for = (type equals "toplevel" | (type equals "x-or" & focusable equals true))

# The layer-shell surfaces that animate themselves - quick settings, the
# calendar, the app grid, the dock's springs, the on-screen keyboard - must
# NOT also be faded by the compositor (wayfire's default fades every
# overlay-layer surface), or they would move twice. Only mako's
# notifications, which cannot animate themselves, are faded here: in and
# out, 200 ms.
fade_enabled_for = app_id is "notifications"
fade_duration = 200
zoom_enabled_for = none
fire_enabled_for = none

# The whole screen fades in from black at the start of the session.
startup_duration = 400


[vswitch]

duration = 340
gap = 0
background = #1A0818FF
# Keys, and three fingers on the touchscreen. The content follows the
# fingers: swiping left brings the workspace on the right.
binding_left = <super> <ctrl> KEY_LEFT | swipe right 3
binding_right = <super> <ctrl> KEY_RIGHT | swipe left 3
binding_up = <super> <ctrl> KEY_UP | swipe down 3
binding_down = <super> <ctrl> KEY_DOWN | swipe up 3
binding_win_left = <super> <ctrl> <shift> KEY_LEFT
binding_win_right = <super> <ctrl> <shift> KEY_RIGHT
binding_win_up = <super> <ctrl> <shift> KEY_UP
binding_win_down = <super> <ctrl> <shift> KEY_DOWN


[vswipe]

# The touchpad: three fingers, and the workspace strip follows them.
fingers = 3
enable_horizontal = true
enable_vertical = true
enable_smooth_transition = true
duration = 340
gap = 32.0
background = #1A0818FF


[scale]

# The windows overview ("현재 활동" in a window manager's sense; the
# top bar's Activities button opens the app grid, which has the apps).
# A three-finger pinch on the touchscreen, or Super+S.
toggle = <super> KEY_S | pinch in 3
duration = 340
spacing = 48
inactive_alpha = 0.85
interact = false
title_overlay = all
title_font_size = 14
bg_color = #0E0E0EE6
text_color = #E8E8E8FF


[expo]

# All nine workspaces at once. Super+Tab, or a four-finger pinch.
toggle = <super> KEY_TAB | pinch in 4
duration = 340
offset = 16
background = #1A0818FF


[grid]

# Snapping to halves and maximising animates, rather than jumping.
# crossfade is the cheap one: two textures, no geometry per frame.
type = crossfade
duration = 300
slot_l = <super> KEY_LEFT
slot_r = <super> KEY_RIGHT
slot_c = <super> KEY_UP
restore = <super> KEY_DOWN


[move]

# Dragging a window to the top edge maximises it, to a side edge snaps it
# to that half - with a finger as with a mouse.
enable_snap = true
enable_snap_off = true
snap_threshold = 10


[place]

mode = center


[switcher]

speed = 340


[wm-actions]

toggle_maximize = <super> KEY_M
minimize = <super> KEY_H


[idle]

# The screen goes off after the time Settings chose; lp-idle (swayidle)
# does it, the same under sway and here, so wayfire's own is off. So is
# its screensaver, the cube.
dpms_timeout = -1
screensaver_timeout = -1


[command]

# Shortcuts. Settings -> Key Assignment lists these; change both together.
binding_terminal = <super> KEY_T
command_terminal = foot
binding_terminal2 = <super> KEY_ENTER
command_terminal2 = foot
binding_files = <super> KEY_E
command_files = lp-files
binding_settings = <super> KEY_I
command_settings = lp-settings
binding_tasks = <ctrl> <shift> KEY_ESC
command_tasks = lp-tasks
binding_apps = <super> KEY_A
command_apps = lp-appgrid toggle
binding_quick = <super> KEY_N
command_quick = lp-quick toggle
binding_lock = <super> KEY_L
command_lock = lp-lock
binding_osk = <super> KEY_K
command_osk = lp-osk toggle

binding_shot = KEY_SYSRQ
command_shot = sh -c 'grim - | wl-copy'
binding_shot_area = <shift> KEY_SYSRQ
command_shot_area = sh -c 'grim -g "$(slurp)" - | wl-copy'
binding_shot_app = <ctrl> <shift> KEY_SYSRQ
command_shot_app = lp-shot

# Volume and brightness keys. Brightness goes through lp-tune, the one
# program that writes the backlight (and remembers it); the panel is told
# at once so its icon does not wait for its next poll.
repeatable_binding_volup = KEY_VOLUMEUP
command_volup = sh -c 'wpctl set-volume -l 1.0 @DEFAULT_AUDIO_SINK@ 5%+; lp-panel refresh'
repeatable_binding_voldown = KEY_VOLUMEDOWN
command_voldown = sh -c 'wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-; lp-panel refresh'
binding_mute = KEY_MUTE
command_mute = sh -c 'wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle; lp-panel refresh'
binding_micmute = KEY_MICMUTE
command_micmute = wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
repeatable_binding_brup = KEY_BRIGHTNESSUP
command_brup = lp-tune brightness set +5
repeatable_binding_brdown = KEY_BRIGHTNESSDOWN
command_brdown = lp-tune brightness set -5

# Ctrl+Alt+Backspace ends the session with SIGTERM - never SIGKILL, which
# leaves the VT in graphics mode (README.md, "When the compositor stops").
binding_logout = <ctrl> <alt> KEY_BACKSPACE
command_logout = lp-logout


[autostart]

# One line: the shell, the same under wayfire and sway. lp-shell-start
# starts every component and brings back any that dies (README.md).
autostart_wf_shell = false
shell = lp-shell-start
