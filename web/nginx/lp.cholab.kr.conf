# lp.cholab.kr - linux-LP 이미지 배포.
#
# 서브도메인을 쓰는 이유: cholab.kr 에 이미 돌고 있는 것을 한 줄도
# 건드리지 않기 위해서다. 이 파일은 서버 블록 하나를 새로 더할 뿐이고,
# 문제가 생기면 이 파일만 지우면 원래대로 돌아간다.
#
# 설치:
#   sudo cp lp.cholab.kr.conf /etc/nginx/sites-available/
#   sudo ln -s /etc/nginx/sites-available/lp.cholab.kr.conf \
#              /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# 인증서는 아래 HTTP 블록만 먼저 올린 뒤 certbot 으로 받는다.
# web/SETUP.md 에 순서가 적혀 있다.

# ── HTTP: 인증서 갱신만 받고 나머지는 HTTPS 로 보낸다 ──────────────
server {
    listen 80;
    listen [::]:80;
    server_name lp.cholab.kr;

    # certbot 이 갱신할 때 여기로 온다. 리다이렉트보다 위에 있어야
    # 한다 - 아래에 두면 챌린지 요청까지 HTTPS 로 튕겨서, 아직
    # 인증서가 없는 첫 발급이 영영 성공하지 못한다.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS ────────────────────────────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name lp.cholab.kr;

    # certbot --nginx 를 쓰면 이 두 줄을 알아서 넣어준다.
    # 손으로 설정할 때만 주석을 푼다.
    # ssl_certificate     /etc/letsencrypt/live/lp.cholab.kr/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/lp.cholab.kr/privkey.pem;

    root /srv/lp-zero/site;
    index index.html;

    # 이 도메인은 이미지 파일만 내보낸다. 업로드받을 것이 없으므로
    # 본문 크기를 최소로 둔다 - 열어둘 이유가 없는 문은 닫아둔다.
    client_max_body_size 1k;

    # 큰 파일을 커널이 직접 보내게 한다. 30MB 짜리를 유저 공간으로
    # 복사했다 다시 내보내면 그만큼이 그대로 낭비다.
    sendfile       on;
    tcp_nopush     on;
    sendfile_max_chunk 512k;

    # 다운로드가 끊겼을 때 이어받을 수 있어야 한다. nginx 는 기본으로
    # Range 요청을 받지만, 명시해두면 앞단에 뭔가 끼어도 지워지지 않는다.
    add_header Accept-Ranges bytes always;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy no-referrer-when-downgrade always;

    access_log /var/log/nginx/lp.cholab.kr.access.log;
    error_log  /var/log/nginx/lp.cholab.kr.error.log;

    # ── 이미지 ────────────────────────────────────────────────────
    location /files/ {
        alias /srv/lp-zero/files/;

        # 브라우저가 열려고 하지 않고 저장하게 한다. 확장자가 .xz 나
        # .zip 이면 대개 알아서 저장하지만, 서버가 Content-Type 을
        # text/plain 으로 짐작해버리면 30MB 짜리 이진 파일이 화면에
        # 쏟아진다.
        types { }
        default_type application/octet-stream;

        # SHA256SUMS.txt 만은 브라우저에서 읽히는 편이 낫다.
        location ~ \.txt$ {
            alias /srv/lp-zero/files/;
            default_type text/plain;
            charset utf-8;
            add_header Cache-Control "public, max-age=300";
        }

        # 이미 xz/zip 으로 압축된 파일이다. 다시 압축하면 CPU 만 쓰고
        # 크기는 오히려 늘어난다.
        gzip off;

        # 파일 이름에 빌드가 구분되지 않으므로 오래 캐시하면 안 된다.
        # 새 이미지를 올렸는데 사람들이 옛 것을 받는 일이 생긴다.
        add_header Cache-Control "public, max-age=600" always;
        add_header Accept-Ranges bytes always;

        autoindex off;
    }

    # ── 페이지 ────────────────────────────────────────────────────
    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "public, max-age=300" always;
    }

    # 숨김 파일은 내보내지 않는다. rsync 가 남긴 임시 파일이나
    # 실수로 들어간 .git 이 공개되는 일을 막는다.
    location ~ /\. {
        deny all;
    }
}
