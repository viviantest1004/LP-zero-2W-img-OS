<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!--
  /etc/fonts/local.conf

  fontconfig decides what an application actually gets when it asks for
  "sans-serif", and every GTK application on this machine asks for
  exactly that before it reads a theme. Naming Pretendard in gtk.css is
  not enough on its own: a widget that never gets a font-family - a
  tooltip, a file chooser's own labels, anything an application draws
  with the default - goes through this file instead.

  The order matters and is the same order the theme states. Pretendard
  has no Hangul syllables of its own for a few rare jamo combinations,
  so Noto Sans CJK KR sits behind it and fontconfig falls through per
  glyph rather than per font.
-->
<fontconfig>

  <alias>
    <family>sans-serif</family>
    <prefer>
      <family>Pretendard Variable</family>
      <family>Pretendard</family>
      <family>Noto Sans CJK KR</family>
      <family>NanumGothic</family>
      <family>DejaVu Sans</family>
    </prefer>
  </alias>

  <alias>
    <family>system-ui</family>
    <prefer><family>Pretendard Variable</family></prefer>
  </alias>

  <alias>
    <family>monospace</family>
    <prefer>
      <family>D2Coding</family>
      <family>NanumGothicCoding</family>
      <family>DejaVu Sans Mono</family>
    </prefer>
  </alias>

  <!-- The screen this is drawn on is an LCD in every case that matters,
       and the faces above are hinted. Leaving these to the compiled-in
       defaults gives Korean at 13px a smeared vertical stem. -->
  <match target="font">
    <edit name="antialias" mode="assign"><bool>true</bool></edit>
    <edit name="hinting" mode="assign"><bool>true</bool></edit>
    <edit name="hintstyle" mode="assign"><const>hintslight</const></edit>
    <edit name="rgba" mode="assign"><const>rgb</const></edit>
    <edit name="lcdfilter" mode="assign"><const>lcddefault</const></edit>
  </match>

  <!-- Emoji is a separate face and always was; without this a missing
       glyph box shows up wherever an application puts one in a label. -->
  <match target="pattern">
    <test name="family"><string>emoji</string></test>
    <edit name="family" mode="assign" binding="same">
      <string>Noto Color Emoji</string>
    </edit>
  </match>

</fontconfig>
